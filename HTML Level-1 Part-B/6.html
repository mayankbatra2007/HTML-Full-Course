<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Level-1 Part-B</title>
</head>
<body>
    <!-- br tag -->
    <p>Twinkle twinkle little star <br> how i wonder what you are</p>
    <!-- bold tag -->
    <p>twinkle twinkle little <b>star</b></p>
    <!-- italic tag -->
    <p>twinkle twinkle little <i>star</i></p>
    <!-- underline tag -->
    <p>twinkle twinkle little <u>star</u></p>
</body>
</html>
