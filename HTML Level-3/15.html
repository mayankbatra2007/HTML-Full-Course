<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Level-3</title>
</head>
<body>
    <!-- Practice Q21 -->
    <h2>Feedback Form</h2>
    <form action="/action">
        <label for="name">Name: </label>
        <input type="text" id="name" placeholder="Write your name" name="name">
        <br>
        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="Write your email" name="email">
        <br>
        <label for="msg">Message:</label>
        <br>
        <textarea name="msg" id="msg" cols="20" rows="4"></textarea>
        <br>
        <label for="rate">Rate us our of 5</label>
        <br>
        <input type="radio" id="1" name="1" value="4">
        <label for="1">1</label>
        <br>
        <input type="radio" id="2" name="2" value="4">
        <label for="2">2</label>
        <br>
        <input type="radio" id="3" name="3" value="4">
        <label for="3">3</label>
        <br>
        <input type="radio" id="4" name="4" value="4">
        <label for="4">4</label>
        <br>
        <button>Send ur message!</button>
    </form>
</body>
</html>
